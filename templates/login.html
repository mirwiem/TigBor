{% extends "base.html" %}
{% block title %}Sign in — TigBor{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card">
  <div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p>Continue your study workspace.</p>
  <form method="post" class="stack">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="btn btn-gold" type="submit">Sign in</button>
  </form>
  <p class="small">No account? <a href="{{ url_for('register') }}">Create one</a>.</p>
</div></section>
{% endblock %}
